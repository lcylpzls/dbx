name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Fuzz errors (5s)
        run: go test -run '^$' -fuzz '^FuzzIsNotFound$' -fuzztime=5s .

      - name: Fuzz scan (5s)
        run: go test -run '^$' -fuzz '^FuzzScan$' -fuzztime=5s .

      - name: Fuzz builder (5s)
        run: go test -run '^$' -fuzz '^FuzzBuilder$' -fuzztime=5s .

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Build and vet examples
        run: |
          for dir in basic dynamic tx migrate; do
            (cd examples/$dir && go build ./... && go vet ./...)
          done

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbx
          POSTGRES_PASSWORD: dbx
          POSTGRES_DB: dbx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Integration tests (MySQL / PostgreSQL / SQLite)
        env:
          DBX_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/dbx_test?parseTime=true&charset=utf8mb4
          DBX_TEST_PG_DSN: postgres://dbx:dbx@127.0.0.1:5432/dbx_test?sslmode=disable
        run: go test -count=1 ./mysql/... ./pg/... ./sqlite/...
