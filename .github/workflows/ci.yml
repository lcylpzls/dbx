name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.5']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2026.1
          staticcheck ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Race detector (Linux)
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

      - name: Coverage (Linux)
        if: runner.os == 'Linux'
        run: go test -count=1 -coverprofile=coverage.out ./...

      - name: Show coverage
        if: runner.os == 'Linux'
        run: go tool cover -func coverage.out

      - name: Upload coverage artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.go }}
          path: coverage.out

  linux-distros:
    name: test (${{ matrix.distro }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: debian:bookworm
            prepare: apt-get update && apt-get install -y --no-install-recommends git ca-certificates curl tar
          - distro: fedora:41
            prepare: dnf -y install git ca-certificates curl tar
          - distro: rockylinux:9
            prepare: dnf -y install --setopt=install_weak_deps=False git
          - distro: archlinux:latest
            prepare: pacman -Syu --noconfirm git ca-certificates curl tar
          - distro: alpine:3.20
            prepare: apk add --no-cache git ca-certificates curl tar
    runs-on: ubuntu-latest
    container: ${{ matrix.distro }}
    env:
      # 容器矩阵仅验证纯 Go 构建链路（glibc/musl 差异），
      # cgo/race 由 ubuntu 主机作业覆盖。
      CGO_ENABLED: '0'
    steps:
      - name: Prepare environment
        run: ${{ matrix.prepare }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Test
        run: go test -count=1 ./...

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Fuzz errors (5s)
        run: go test -run '^$' -fuzz '^FuzzIsNotFound$' -fuzztime=5s .

      - name: Fuzz scan (5s)
        run: go test -run '^$' -fuzz '^FuzzScan$' -fuzztime=5s .

      - name: Fuzz builder (5s)
        run: go test -run '^$' -fuzz '^FuzzBuilder$' -fuzztime=5s .

  examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Build and vet examples
        run: |
          for dir in basic dynamic tx migrate; do
            (cd examples/$dir && go build ./... && go vet ./...)
          done

  bench:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Run benchmarks (baseline only, no gate)
        run: go test -run '^$' -bench . -benchmem -benchtime=1s . | tee bench.log

      - name: Upload benchmark log
        uses: actions/upload-artifact@v7
        with:
          name: bench-log
          path: bench.log

  apidiff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Install apidiff
        run: go install golang.org/x/exp/cmd/apidiff@latest

      # 只报告 API 差异,不设硬性门禁:
      # v0.2.0 起允许有意的破坏性变更,报告结果供评审参考。
      - name: API diff vs v0.1.0 (informational)
        continue-on-error: true
        run: |
          git worktree add /tmp/dbx-v010 v0.1.0 >/dev/null
          (cd /tmp/dbx-v010 && apidiff -w /tmp/dbx-old.export github.com/lcylpzls/dbx)
          apidiff -w /tmp/dbx-new.export github.com/lcylpzls/dbx
          apidiff /tmp/dbx-old.export /tmp/dbx-new.export
          git worktree remove /tmp/dbx-v010 --force

  integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: dbx_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dbx
          POSTGRES_PASSWORD: dbx
          POSTGRES_DB: dbx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dbx"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
          check-latest: true

      - name: Integration tests (MySQL / PostgreSQL / SQLite)
        env:
          DBX_TEST_MYSQL_DSN: root:root@tcp(127.0.0.1:3306)/dbx_test?parseTime=true&charset=utf8mb4
          DBX_TEST_PG_DSN: postgres://dbx:dbx@127.0.0.1:5432/dbx_test?sslmode=disable
        run: go test -count=1 ./mysql/... ./pg/... ./sqlite/...
